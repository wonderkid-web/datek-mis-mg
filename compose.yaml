services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: datek-mis
    ports:
      - "3001:3001"
      - "5555:5555" 

    env_file:
      - .env
    environment:
      # go2rtc hanya dijangkau dari dalam network compose, tidak dari luar.
      GO2RTC_URL: http://go2rtc:1984
    depends_on:
      - go2rtc
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    # Port 1984 sengaja TIDAK dipublish ke host: satu-satunya jalan masuk
    # ke stream kamera adalah lewat /api/cctv/* milik datek yang dijaga NextAuth.
    restart: unless-stopped
